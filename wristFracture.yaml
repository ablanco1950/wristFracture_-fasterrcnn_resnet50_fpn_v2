# Images and labels direcotry should be relative to train.py
TRAIN_DIR_IMAGES: 'data/wristFracture/dataset/train'
TRAIN_DIR_LABELS: 'data/wristFracture/dataset/train'
VALID_DIR_IMAGES: 'data/wristFracture/dataset/valid'
VALID_DIR_LABELS: 'data/wristFracture/dataset/valid'

# Class names.
CLASSES: [
    '__background__',
    'Fracture Detection - v1 2024-04-12 4-09pm'
]

# Number of classes (object classes + 1 for background class in Faster RCNN).
NC: 2

# Whether to save the predictions of the validation set while training.
SAVE_VALID_PREDICTION_IMAGES: True
